org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# Each CI job starts from a fresh checkout (only ~/.gradle is cached by setup-gradle, not
# build/ dirs), so there is never prior incremental state to reuse - disabling it drops the
# bookkeeping overhead with no compile-time downside.
kotlin.incremental=false
