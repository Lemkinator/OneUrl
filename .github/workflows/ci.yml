name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run formatting checks
        run: chmod +x ./gradlew && ./gradlew spotlessCheck detekt --stacktrace
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: app/build/reports/detekt/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run lint
        run: chmod +x ./gradlew && ./gradlew lintDebug --stacktrace
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*

  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run local tests
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest verifyRoborazziDebug koverXmlReportDebug koverHtmlReportDebug koverVerifyDebug --stacktrace
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: app/build/reports/kover/reportDebug.xml
          flags: unittests
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: app/build/test-results/testDebugUnitTest/*.xml
          flags: unittests
      - name: Upload coverage report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-report
          path: app/build/reports/kover/htmlDebug/
      - name: Upload diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-diff
          path: app/build/reports/roborazzi/
      # Gradle's console prints only "<exceptionClass> at <frame>"; the message is in these.
      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: false
          tool-cache: true
          dotnet: true
          haskell: true
          swap-storage: true
          docker-images: false
          large-packages: false
      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check runner
        # /dev/kvm may legitimately be absent here; that's what this step is diagnosing.
        run: |
          date -u
          ls -l /dev/kvm || true
          nproc
          free -m
          df -h /
      - name: Run instrumented tests (GMD)
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew pixel9Api35DebugAndroidTest \
            -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true \
            --info \
            --stacktrace \
            | tee gmd-build.log
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      # The GMD task passes when the app process crashes before any test starts (0 tests run).
      - name: Check instrumented test count
        run: |
          shopt -s globstar nullglob
          pattern='<testsuites[^>]*[[:space:]]tests="([0-9]+)"'
          status=0
          for module in app; do
            results="$module/build/outputs/androidTest-results/managedDevice/debug"
            reports=("$results"/**/TEST-*.xml)
            if [ ${#reports[@]} -eq 0 ]; then
              echo "::error::$module: no TEST-*.xml report under $results"
              status=1
              continue
            fi
            executed=0
            for report in "${reports[@]}"; do
              if [[ $(<"$report") =~ $pattern ]]; then
                executed=$((executed + 10#${BASH_REMATCH[1]}))
              else
                echo "::error::$module: no <testsuites tests=\"N\"> in $report"
                status=1
              fi
            done
            sources=("$module"/src/androidTest/**/*.{kt,java})
            expected=$(perl -0777 -ne 's{"""[\s\S]*?"{3,}|"(?:\\.|[^"\\\n])*"|(/\*(?:(?1)|.)*?\*/)|//[^\n]*}{}gs; $n += () = /@(?:org\.junit\.)?Test\b/g; END { print $n + 0 }' "${sources[@]}" </dev/null)
            echo "$module: Executed $executed instrumented tests (expected ≥ $expected)"
            if [ "$executed" -eq 0 ] || [ "$executed" -lt "$expected" ]; then
              echo "::error::$module: the managed device ran $executed instrumented tests, expected at least $expected"
              status=1
            fi
          done
          exit "$status"
      - name: Dump kernel log on failure
        if: failure()
        run: sudo dmesg --ctime | tail -n 200 || true
      - name: Upload GMD diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gmd-diagnostics
          if-no-files-found: ignore
          path: |
            ~/.android/avd/gradle-managed/**/*.txt
            gmd-build.log
            app/build/outputs/androidTest-results/managedDevice/

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25.0.4+101.0.LTS'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble
        run: chmod +x ./gradlew && ./gradlew assembleRelease -Pandroidx.baselineprofile.skipgeneration -x :benchmarks:pixel9Api35Setup --stacktrace
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
