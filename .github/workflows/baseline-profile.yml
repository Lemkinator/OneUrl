name: Baseline Profile

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # automaticGenerationDuringBuild is unconditional for the release variant, so assembleRelease
      # itself is what exercises the real generator end to end - this is the same command the
      # release workflow runs, making this job an early-warning rehearsal for it.
      - name: Build release APK with a freshly generated baseline profile
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --stacktrace
        env:
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: Verify baseline profile packaged
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          [ -f "$apk" ] || { echo "::error::Release APK not found at $apk"; exit 1; }
          prof_size=$(unzip -p "$apk" assets/dexopt/baseline.prof 2>/dev/null | wc -c)
          [ "$prof_size" -gt 1024 ] || { echo "::error::assets/dexopt/baseline.prof missing or too small in $apk ($prof_size bytes)"; exit 1; }
          echo "Embedded profile in APK: $prof_size bytes"
          mapfile -t dms < <(find app/build/outputs/apk/release/baselineProfiles -name '*.dm')
          [ "${#dms[@]}" -ge 2 ] || { echo "::error::Expected at least 2 baseline profile buckets (one per supported dex-metadata format range), found ${#dms[@]}"; exit 1; }
          for dm in "${dms[@]}"; do
            size=$(stat -c%s "$dm")
            [ "$size" -gt 1024 ] || { echo "::error::$dm too small ($size bytes)"; exit 1; }
            echo "Packaged baseline profile: $dm ($size bytes)"
          done
      # saveInSrc = false means the human-readable .txt lives under an AGP-internal, unstable
      # intermediates/ path that varies by AGP version - the compiled .dm under outputs/ is the
      # one stable, public path, so upload that instead of guessing at internals.
      - name: Upload baseline profile
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: app/build/outputs/apk/release/baselineProfiles/
