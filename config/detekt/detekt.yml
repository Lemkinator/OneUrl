config:
  validation: true
  warningsAsErrors: false

processors:
  active: true
  exclude: [ ]

console-reports:
  active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

complexity:
  active: true
  LongParameterList:
    active: true
    allowedFunctionParameters: 6
    allowedConstructorParameters: 7
  TooManyFunctions:
    active: true
    # Why (2026-09-13): ignoreOverridden — Activity lifecycle callbacks (onCreate, onNewIntent,
    # ...) are framework-mandated, not class-owned complexity. allowedFunctionsPerClass raised
    # from the default 11 — OneUI activities (this app is multi-activity, see GetIcon/CLAUDE.md)
    # own lifecycle + view setup + state collection + click handlers in one class by design;
    # IconActivity currently needs 12.
    ignoreOverridden: true
    allowedFunctionsPerClass: 12
  ComplexCondition:
    allowedConditions: 4

style:
  active: true
  MagicNumber:
    active: true
    ignoreNumbers: [ '-1', '0', '1', '2' ]
    ignorePropertyDeclaration: false
    ignoreCompanionObjectPropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 140
  ForbiddenComment:
    active: true
    comments: [ 'TODO:', 'FIXME:' ]
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true

naming:
  FunctionNaming:
    functionPattern: '[a-z][A-Za-z0-9]*'
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

empty-blocks:
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: false

exceptions:
  active: true
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - Error
      - Exception
      - RuntimeException
      - Throwable
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - InterruptedException
      - MalformedURLException
      - NumberFormatException
      - ParseException

potential-bugs:
  active: true
  ImplicitDefaultLocale:
    active: true
  UnsafeCallOnNullableType:
    active: true
