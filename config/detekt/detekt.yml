coroutines:
  GlobalCoroutineUsage:
    active: true

complexity:
  TooManyFunctions:
    active: false
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true
  LargeClass:
    excludes: ['**/test/**', '**/androidTest/**', '**/testFixtures/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']

style:
  MagicNumber:
    ignorePropertyDeclaration: false
  MaxLineLength:
    maxLineLength: 140
  RedundantExplicitType:
    active: true
  UnnecessaryLet:
    active: true
  UnnecessaryParentheses:
    active: true
  UnusedImport:
    active: true
  UseIfEmptyOrIfBlank:
    active: true
  VarCouldBeVal:
    ignoreAnnotated: ['org.robolectric.annotation.RealObject']
